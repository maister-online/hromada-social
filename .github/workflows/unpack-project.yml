name: Unpack project ZIP

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  unpack:
    if: ${{ !contains(github.event.head_commit.message, '[unpack]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and unpack project ZIP
        shell: bash
        run: |
          set -e
          zipfile=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$zipfile" ]; then
            echo "No ZIP file found."
            exit 0
          fi
          rm -rf /tmp/project
          mkdir -p /tmp/project
          unzip -q "$zipfile" -d /tmp/project
          root=$(find /tmp/project -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ -n "$root" ] && [ "$(find /tmp/project -mindepth 1 -maxdepth 1 | wc -l)" = "1" ]; then
            cp -a "$root"/. ./
          else
            cp -a /tmp/project/. ./
          fi
          rm -f "$zipfile"
          rm -rf /tmp/project

      - name: Commit unpacked project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Unpack project [unpack]"
          git push